name: Deploy chat

# Deploys the Taiwan chat backend in chat/ (one Worker and its Durable Object room) to Cloudflare's free plan.
# The design is in docs/superpowers/specs/2026-10-21-taiwan-chat-design.md, and Bryan's setup steps are in docs/chat-setup.md.
# Until every secret below is set, the first step stops the run with a notice instead of a failure, so the chat code can
# merge before the Cloudflare and LINE setup is done.
on:
  push:
    branches: [main]
    paths:
      - "chat/**"
      - ".github/workflows/chat.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: a second push waits for the first to finish instead of racing it.
concurrency: chat

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The secrets go only to the steps that need them: this check, the secrets file and the deploy. npm ci and the
      # tests never see them.
      - name: Check the secrets are set
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SUB_PEPPER: ${{ secrets.SUB_PEPPER }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
        shell: bash
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LINE_CHANNEL_ID LINE_CHANNEL_SECRET SESSION_SECRET SUB_PEPPER ADMIN_CODE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Chat not deployed::Not set up yet. Missing secrets:$missing. The steps are in docs/chat-setup.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'
      # Wrangler needs Node 22 or newer.
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat/package-lock.json
      - name: Install and test
        if: steps.guard.outputs.ready == 'true'
        working-directory: chat
        run: npm ci && npm test
      # The five Worker secrets go up with the deploy itself, from a file only this job's user can read, kept outside the
      # checkout. jq writes it, so no secret is ever pasted into a command line or quoted by hand.
      - name: Write the secrets file
        if: steps.guard.outputs.ready == 'true'
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SUB_PEPPER: ${{ secrets.SUB_PEPPER }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
        run: |
          umask 077
          jq -n 'env | {LINE_CHANNEL_ID, LINE_CHANNEL_SECRET, SESSION_SECRET, SUB_PEPPER, ADMIN_CODE}' > "$RUNNER_TEMP/chat-secrets.json"
      # One `wrangler deploy --secrets-file` makes the code and the secrets one new version, so open chat sockets drop
      # once per deploy and the app reconnects by itself. With no wranglerVersion given, the action uses the Wrangler
      # that npm ci installed from chat/package-lock.json. The action is pinned to a commit (v4.1.3), not a tag, because
      # it holds the Cloudflare token and a tag can be moved.
      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: chat
          command: deploy --secrets-file ${{ runner.temp }}/chat-secrets.json
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/chat-secrets.json"
