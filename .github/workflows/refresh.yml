name: Refresh WaveSlave

# Rebuild the forecast from CWA + Open-Meteo every half hour and publish it to GitHub Pages.
# GitHub often skips scheduled runs (only 2 ran overnight on Oct 13-14), so two slots an hour keeps the data fresher.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The West Pacific map grid (refetched every ~3 h) and the forecast-vs-buoy log carry over between runs.
      - uses: actions/cache/restore@v4
        with:
          path: |
            cache
            log
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Build
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
          TZ: Asia/Taipei
        run: sh build-site.sh _site
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            cache
            log
          key: state-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
