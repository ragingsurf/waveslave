<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#07171d">

<meta name="apple-mobile-web-app-title" content="WaveSlave">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
<!-- Passcode screen: the page stays hidden until the 4-digit code is entered, then stays unlocked on that device.
     Only a SHA-256 of "waveslave:" + the code is kept here. To change the code: printf 'waveslave:1234' | sha256sum, and put the result in H. -->
<script>/* Locked unless this device already holds the current code's hash. */(function(){var H="9ce703461ba3b584a69bd3eabb70ebadcb06e3e5c11ebf11b06c7184e2aba77b";window.__lockHash=H;try{if(localStorage.getItem("waveslave-unlock")===H)return}catch(e){}document.documentElement.classList.add("locked")})();</script>
<style>html.locked,html.locked body{overflow:hidden}html.locked body>*{visibility:hidden}html.locked::before{content:"";position:fixed;inset:0;z-index:9998;background:radial-gradient(circle at 50% 40%,#24183f,#07050f 70%)}
#lock{visibility:visible!important;position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;color:#f4ecff;font:500 16px/1.4 "Public Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#lock .lk-brand{font-family:"Metal Mania","Impact","Arial Black",serif;font-size:clamp(48px,14vw,84px);line-height:1;padding:2px 6px;transform:rotate(-7deg) skewX(-14deg);margin-bottom:10px;background:linear-gradient(180deg,#fff7b0 0%,#ffd400 28%,#ff8a00 55%,#ff3d00 78%,#b80000 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:1px #200300;filter:drop-shadow(0 0 8px rgba(255,60,0,.7)) drop-shadow(2px 3px 0 #200300)}
#lock .lk-msg{min-height:1.4em;letter-spacing:.02em;opacity:.85}#lock .lk-msg.bad{color:#ff8a6a;opacity:1}
#lock .lk-dots{display:flex;gap:18px}#lock .lk-dots i{width:16px;height:16px;border-radius:50%;border:2px solid #ffb347;transition:background .12s}#lock .lk-dots i.on{background:#ffb347;box-shadow:0 0 10px #ff8a00}
#lock .lk-dots.shake{animation:lkShake .4s}@keyframes lkShake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#lock .lk-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:6px}
#lock button{width:72px;height:72px;border-radius:50%;border:1px solid rgba(255,179,71,.45);background:rgba(255,255,255,.06);color:#fff7e6;font:600 28px/1 "JetBrains Mono",ui-monospace,monospace;cursor:pointer;touch-action:manipulation}
#lock button:active{background:rgba(255,138,0,.35)}#lock button:focus-visible{outline:2px solid #ffd400;outline-offset:3px}
#lock button.lk-del{border-color:transparent;background:none;font-size:22px}</style>
<script>/* The keypad: tap the numbers or type them; a wrong code shakes and clears. The right one is remembered and the page reloads unlocked. */document.documentElement.classList.contains("locked")&&addEventListener("DOMContentLoaded",function(){
var T={en:["Enter passcode","Wrong code, try again","Delete"],zh:["請輸入密碼","密碼錯誤，請再試一次","刪除"],ja:["パスコードを入力","パスコードが違います","削除"]}[(document.documentElement.lang||"en").slice(0,2)]||["Enter passcode","Wrong code, try again","Delete"];
var d=document.createElement("div");d.id="lock";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");d.setAttribute("aria-label",T[0]);
d.innerHTML='<div class="lk-brand">WaveSlave</div><div class="lk-msg" aria-live="polite"></div><div class="lk-dots"><i></i><i></i><i></i><i></i></div><div class="lk-pad">'+[1,2,3,4,5,6,7,8,9].map(function(n){return'<button type="button" data-n="'+n+'">'+n+"</button>"}).join("")+'<span></span><button type="button" data-n="0">0</button><button type="button" class="lk-del" aria-label="'+T[2]+'">⌫</button></div>';
document.body.appendChild(d);var msg=d.querySelector(".lk-msg"),dots=d.querySelector(".lk-dots"),code="",busy=false;msg.textContent=T[0];
function draw(){[].forEach.call(dots.children,function(e,i){e.className=i<code.length?"on":""})}
function sha(s){return window.crypto&&crypto.subtle?crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return[].map.call(new Uint8Array(b),function(x){return(x+256).toString(16).slice(1)}).join("")}):Promise.resolve("")}
function check(){busy=true;sha("waveslave:"+code).then(function(h){if(h===window.__lockHash){try{localStorage.setItem("waveslave-unlock",h)}catch(e){}location.reload();return}
msg.textContent=T[1];msg.className="lk-msg bad";dots.classList.remove("shake");void dots.offsetWidth;dots.classList.add("shake");if(navigator.vibrate)navigator.vibrate(120);setTimeout(function(){code="";draw();busy=false},350)})}
function press(k){if(busy)return;code=k==="del"?code.slice(0,-1):code.length<4?code+k:code;draw();if(code.length===4)check()}
d.addEventListener("click",function(e){var b=e.target.closest("button");if(b)press(b.classList.contains("lk-del")?"del":b.getAttribute("data-n"))});
addEventListener("keydown",function(e){if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del")});
});</script>
