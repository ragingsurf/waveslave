<script>/* Two locks share one code and one keypad. ON locks the whole page on every visit (each new tab or app launch); WORLD locks only World mode, so the secret W asks for the code before the other countries come on. Either way an unlock lasts for this visit (sessionStorage), and an app left in the background over a minute locks again when it comes back. */(function(){var ON=false,WORLD=true,H="b200079bce89b4d2c4e55f2ef5812f58c1b9827f5086ae8a08bdf78b0d43bcde";window.__lockHash=H;window.__worldLock=WORLD;var ok=false;try{localStorage.removeItem("waveslave-unlock");ok=sessionStorage.getItem("waveslave-unlock")===H}catch(e){}window.wsUnlocked=function(){try{return sessionStorage.getItem("waveslave-unlock")===H}catch(e){return ok}};var gone=0;document.addEventListener("visibilitychange",function(){if(!wsUnlocked())return;if(document.hidden)gone=Date.now();else if(gone&&Date.now()-gone>60000){try{sessionStorage.removeItem("waveslave-unlock")}catch(e){}if(ON||document.documentElement.classList.contains("world"))location.reload()}});if(ON&&!ok)document.documentElement.classList.add("locked")})();</script>

<script>/* The keypad: tap the numbers or type them; a wrong code shows ACCESS DENIED and clears. The right one shows ACCESS GRANTED, then the screen fades and done() runs (the whole-page lock reloads unlocked). ✕ or Esc backs out (only where there is something to go back to). */

var keys=[1,2,3,4,5,6,7,8,9].map(function(n){return'<button type="button" data-n="'+n+'"><b>'+n+"</b></button>"}).join("")+'<span></span><button type="button" data-n="0"><b>0</b></button><button type="button" class="lk-del" aria-label="'+T[2]+'"><b>⌫</b></button>';
d.innerHTML=LOCK_HTML(T,'<div class="lk-dots"><i></i><i></i><i></i><i></i></div>','<div class="lk-pad">'+keys+"</div>");if(cancel){var x=document.createElement("button");x.type="button";x.className="lk-x";x.setAttribute("aria-label","Close");x.textContent="✕";d.querySelector(".lk-box").appendChild(x)}
